<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fly Cleaner logo">
  <defs>
    <linearGradient id="fc-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A57F"/>
      <stop offset="1" stop-color="#0B5D4E"/>
    </linearGradient>
    <linearGradient id="fc-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
  </defs>
  <!-- rounded badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#fc-badge)"/>
  <!-- motion swoosh (fly) -->
  <path d="M12 44c8 6 26 8 40-4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <!-- sparkle: big 4-point star -->
  <path d="M34 12c1.6 8.2 4.2 11.4 13 13-8.8 1.6-11.4 4.8-13 13-1.6-8.2-4.2-11.4-13-13 8.8-1.6 11.4-4.8 13-13z" fill="url(#fc-shine)"/>
  <!-- small sparkle -->
  <path d="M19 20c.8 3.6 2 5 5.6 5.8-3.6.8-4.8 2.2-5.6 5.8-.8-3.6-2-5-5.6-5.8 3.6-.8 4.8-2.2 5.6-5.8z" fill="#FFFFFF" opacity=".9"/>
  <!-- bubble -->
  <circle cx="45" cy="43" r="4.6" fill="#FFFFFF" opacity=".85"/>
  <circle cx="36" cy="46.5" r="2.6" fill="#FFFFFF" opacity=".55"/>
</svg>
